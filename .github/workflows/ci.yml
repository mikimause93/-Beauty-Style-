name: CI

on:
  push:
    branches: [main, 'copilot/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  ai-style-service:
    name: AI Style Service – Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/ai-style-service/package-lock.json

      - name: Install dependencies
        working-directory: backend/services/ai-style-service
        run: npm ci

      - name: Run tests
        working-directory: backend/services/ai-style-service
        run: npm test

  docker-build:
    name: Docker Build – AI Style Service
    runs-on: ubuntu-latest
    needs: ai-style-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ai-style-service:ci ./backend/services/ai-style-service
