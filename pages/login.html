<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your Beauty & Style account to manage bookings, orders, and your profile." />
  <title>Sign In — Beauty &amp; Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf8f4 0%, #f9f0e8 50%, #fdf5f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 48px;
      box-shadow: var(--shadow-xl);
    }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-title { font-family: var(--font-primary); font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
    .auth-subtitle { font-size: .9rem; color: var(--gray-500); text-align: center; margin-bottom: 32px; }
    .social-login { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); font-size: .88rem; font-weight: 600; background: white; cursor: pointer; transition: var(--transition); color: var(--secondary); }
    .social-btn:hover { background: var(--gray-100); border-color: var(--gray-300); }
    .divider-text { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .divider-text::before, .divider-text::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    .divider-text span { font-size: .78rem; color: var(--gray-400); white-space: nowrap; }
    .forgot-link { font-size: .82rem; color: var(--primary); font-weight: 600; float: right; margin-bottom: 6px; }
    .forgot-link:hover { text-decoration: underline; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: .88rem; color: var(--gray-600); }
    .auth-footer a { color: var(--primary); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .password-wrapper { position: relative; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: .9rem; color: var(--gray-500); background: none; border: none; padding: 4px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="nav-logo-icon">✦</div>
        <span class="nav-logo-text">Beauty<span>&Style</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="services.html" class="nav-link">Services</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
        <li><a href="booking.html" class="nav-link">Book Now</a></li>
      </ul>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-logo">
        <a href="../index.html" style="display:inline-flex; align-items:center; gap:10px; text-decoration:none;">
          <div class="nav-logo-icon" style="width:48px; height:48px; font-size:1.5rem;">✦</div>
          <span class="nav-logo-text" style="font-size:1.6rem;">Beauty<span>&Style</span></span>
        </a>
      </div>

      <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>

        <div class="social-login">
          <button class="social-btn" onclick="window.BS?.showToast('Google sign-in coming soon!', 'info')">
            <span style="font-size:1.1rem;">G</span> Continue with Google
          </button>
          <button class="social-btn" onclick="window.BS?.showToast('Facebook sign-in coming soon!', 'info')">
            <span style="font-size:1.1rem;">f</span> Continue with Facebook
          </button>
        </div>

        <div class="divider-text"><span>or sign in with email</span></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="l-email">Email Address</label>
            <input type="email" id="l-email" class="form-control" placeholder="your@email.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <a href="#" class="forgot-link">Forgot password?</a>
            <label class="form-label" for="l-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="l-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
              <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>

          <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px; font-size:.85rem; color:var(--gray-600);">
            <input type="checkbox" id="remember-me" style="width:16px; height:16px; accent-color:var(--primary); cursor:pointer;" />
            <label for="remember-me">Keep me signed in</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create one for free</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    // Password toggle
    document.getElementById('toggle-password')?.addEventListener('click', function() {
      const pwd = document.getElementById('l-password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        this.textContent = '🙈';
      } else {
        pwd.type = 'password';
        this.textContent = '👁';
      }
    });

    // Form submission
    document.getElementById('login-form')?.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('l-email').value.trim();
      const password = document.getElementById('l-password').value;

      if (!email || !password) {
        window.BS?.showToast('Please enter your email and password', 'error');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        window.BS?.showToast('Please enter a valid email address', 'error');
        return;
      }

      // Simulate login
      window.BS?.showToast('Signing in...', 'info');
      setTimeout(() => {
        window.location.href = 'profile.html';
      }, 1000);
    });
  </script>
</body>
</html>
