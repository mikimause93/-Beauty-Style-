<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#FF69B4" />
    <meta name="description" content="Beauty &amp; Style — discover makeup, skincare, hairstyle guides and book appointments." />
    <title>Beauty &amp; Style</title>
    <style>
      /*
       * Without these rules, React Native web's flex:1 layout collapses to
       * 0px height because the HTML/body/root elements have no intrinsic
       * height — producing a completely black/empty screen.
       */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        /* Match the branded loading colour so there is no flash of black */
        background-color: #ff69b4;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
